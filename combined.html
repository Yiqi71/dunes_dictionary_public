<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沙丘词典</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1E1C16;
        }
        #layout {
            display: flex;
            width: 100%;
            height: 100%;
        }
        #layout iframe {
            border: none;
            height: 100%;
            flex-shrink: 0;
        }
        #frame-entry  { flex: 1; }
        #frame-index  { flex: 2; }
        #frame-echoes { flex: 1; }
    </style>
</head>
<body>
    <div id="layout">
        <iframe id="frame-entry"  src="entry-panel.html"></iframe>
        <iframe id="frame-index"  src="index.html?nopanel=1"></iframe>
        <iframe id="frame-echoes" src="echoes-panel.html"></iframe>
    </div>
</body>
</html>
