    <script>(function(){if(new URLSearchParams(location.search).get('nopanel')==='1')document.documentElement.classList.add('nopanel');}());</script>
    <script>
      // 注册离线缓存：即使本地服务器(iSH)之后被系统挂起/关闭，
      // 已经预缓存过的网站也能继续从缓存离线运行。
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('Service worker registration failed:', err);
          });
        });

        // 收到 sw.js 发来的"缓存完成"消息后，弹一个悬浮提示条（覆盖在内容上方，
        // 不占用页面布局空间）。用localStorage做标记，保证这辈子（这台设备上）
        // 只弹这一次，弹完之后彻底从DOM里移除，不留任何痕迹。
        navigator.serviceWorker.addEventListener('message', (event) => {
          if (event.data && event.data.type === 'sw-precache-done') {
            const ALERTED_KEY = 'dunes_offline_precache_alerted';
            if (localStorage.getItem(ALERTED_KEY) === '1') return;
            localStorage.setItem(ALERTED_KEY, '1');

            const msg = event.data.failed > 0
              ? `离线缓存完成，但有 ${event.data.failed}/${event.data.total} 个文件失败，请检查`
              : `离线内容已准备好（共 ${event.data.total} 个文件），现在可以添加到主屏幕并断开网络测试`;

            const overlay = document.createElement('div');
            overlay.id = 'offline-ready-toast';
            const box = document.createElement('div');
            box.id = 'offline-ready-toast-box';
            box.className = event.data.failed > 0 ? 'offline-ready-toast-box--warn' : '';
            box.textContent = msg;
            overlay.appendChild(box);
            document.body.appendChild(overlay);

            const remove = () => overlay.remove();
            overlay.addEventListener('click', remove);
            setTimeout(remove, 6000);
          }
        });
      }
    </script>
    <style>
      /* 这个元素是JS动态创建/移除的，默认不存在于DOM里，不会占用任何版面空间。 */
      #offline-ready-toast {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(0, 0, 0, 0.35);
      }
      #offline-ready-toast-box {
        max-width: 420px;
        padding: 18px 22px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.5;
        text-align: center;
        background: #2f7d3a;
        color: #FAF4E5;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      }
      #offline-ready-toast-box.offline-ready-toast-box--warn {
        background: #a13b2b;
      }
    </style>
